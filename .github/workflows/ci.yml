on: push

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - run: npm ci
      - run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish